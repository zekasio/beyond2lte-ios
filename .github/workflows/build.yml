name: Build beyond2lte XNU + UEFI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_userspace:
        description: Build HFS+ userspace image from IPSW (requires >25GB free runner disk)
        required: false
        type: boolean
        default: false
      enable_touch:
        description: "Enable B2LTouchDxe in firmware profile"
        type: boolean
        default: false

env:
  XNU_COMMIT: ac9718fb1af618d5ce8678d0dc6e8a58f252216f
  AVAILABILITY_COMMIT: 149b1777f3e8c2133042d8e188f72e3adf6a7110
  LIBDISPATCH_COMMIT: 701f4d1a24ae9c6863901bbbb22624b7d1b87321
  MU_SILICIUM_COMMIT: 2147dec93fc293ec85b1814a828816130d6f93b7
  MU_BASECORE_COMMIT: 762a65dad79e2934cddbefa467b7e2c7b5ee4bc0
  BEYOND2LTE_UEFI_COMMIT: 48add5bb03ab6f7ee4eb5aa04a30366e6dde6ba3

jobs:
  build:
    name: Build XNU, UEFI Firmware, and boot.img
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout beyond2lte-ios
        uses: actions/checkout@v4

      - name: Set up workspace paths and environment
        run: |
          mkdir -p out/kdk out/deps out/build-env out/ipsw out/mu out/ci-boot
          echo "KDKROOT=$GITHUB_WORKSPACE/out/kdk" >> "$GITHUB_ENV"
          echo "B2L_DEPSROOT=$GITHUB_WORKSPACE/out/deps" >> "$GITHUB_ENV"
          echo "B2L_BUILD_ENV=$GITHUB_WORKSPACE/out/build-env" >> "$GITHUB_ENV"
          echo "MU_WORK_TREE=$GITHUB_WORKSPACE/out/mu" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      - name: Install toolchain dependencies
        run: |
          brew update
          brew install llvm lld nasm acpica rsync jq blacktop/tap/ipsw
          LLVM_PREFIX="$(brew --prefix llvm)"
          LLD_PREFIX="$(brew --prefix lld)"
          mkdir -p out/llvm-bin
          ln -sf "$LLVM_PREFIX/bin/"* out/llvm-bin/
          ln -sf "$LLD_PREFIX/bin/lld-link" out/llvm-bin/lld-link
          ln -sf "$LLD_PREFIX/bin/ld.lld" out/llvm-bin/ld.lld
          echo "CLANG_BIN=$GITHUB_WORKSPACE/out/llvm-bin" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/out/llvm-bin" >> "$GITHUB_PATH"
          python3 -m venv out/venv
          echo "PYTHON_COMMAND=$GITHUB_WORKSPACE/out/venv/bin/python" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/out/venv/bin" >> "$GITHUB_PATH"
          out/venv/bin/python -m pip install --upgrade pip pyopenssl

      - name: Verify Xcode SDKs
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path

      - name: Restore KDK and HFS userspace image cache
        id: cache-kdk-hfs
        uses: actions/cache/restore@v4
        with:
          path: |
            out/kdk
          key: b2l-kdk-25f71-v3

      - name: Download and stage KDK (26.5 build 25F71)
        env:
          KDK_URL: ${{ secrets.KDK_URL }}
        run: |
          if [[ -z "$KDK_URL" ]]; then
            KDK_URL="https://github.com/dortania/KdkSupportPkg/releases/download/25F71/Kernel_Debug_Kit_26.5_build_25F71.dmg"
          fi
          echo "Downloading KDK from $KDK_URL"
          curl -fSL "$KDK_URL" -o out/kdk-download
          if [[ "$KDK_URL" == *.dmg* ]] || hdiutil imageinfo out/kdk-download >/dev/null 2>&1; then
            mv out/kdk-download out/kdk-download.dmg
            MOUNT_DIR="$(mktemp -d)"
            hdiutil attach out/kdk-download.dmg -mountpoint "$MOUNT_DIR" -nobrowse -readonly
            trap 'hdiutil detach "$MOUNT_DIR" -force || true' EXIT
            ls -la "$MOUNT_DIR"
            pkg_root="$(mktemp -d)"
            PKG_FILE="$(find "$MOUNT_DIR" -maxdepth 1 -name '*.pkg' | head -n 1)"
            pkgutil --expand-full "$PKG_FILE" "$pkg_root/expanded" || true
            for sub in KDK.pkg KDK_SDK.pkg; do
              if [[ -d "$pkg_root/expanded/$sub/Payload" ]]; then
                rsync -a "$pkg_root/expanded/$sub/Payload/" "$KDKROOT/"
              elif [[ -f "$MOUNT_DIR/$sub" ]]; then
                pkgutil --expand-full "$MOUNT_DIR/$sub" "$pkg_root/$sub"
                rsync -a "$pkg_root/$sub/Payload/" "$KDKROOT/"
              fi
            done
            if [[ ! -d "$KDKROOT/System/Library/Frameworks/Kernel.framework" ]] && [[ -d "$pkg_root/expanded/Payload" ]]; then
              rsync -a "$pkg_root/expanded/Payload/" "$KDKROOT/"
            fi
          else
            tar -xf out/kdk-download -C "$KDKROOT"
          fi
          rm -f out/kdk-download out/kdk-download.dmg
          test -d "$KDKROOT/System/Library/Frameworks/Kernel.framework"

      - name: Download or prepare IPSW / HFS userspace image
        if: ${{ inputs.build_userspace == true }}
        env:
          USERDATA_HFS_URL: ${{ secrets.USERDATA_HFS_URL }}
          IPSW_URL: ${{ secrets.IPSW_URL }}
        run: |
          df -h
          mkdir -p out/ipsw
          if [[ -n "$USERDATA_HFS_URL" ]]; then
            curl -fSL "$USERDATA_HFS_URL" -o out/ipsw/ios26-userdata.hfs.img
          else
            if [[ -z "$IPSW_URL" ]]; then
              IPSW_URL="$(curl -fsSL "https://api.ipsw.me/v4/device/iPhone17,2?type=ipsw" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(f['url'] for f in d['firmwares'] if f['version']=='26.5'))")"
            fi
            echo "Resolving rootfs DMG from $IPSW_URL"
            mkdir -p out/ipsw/extracted
            ROOT_FILE="$(python3 -c '
            import io, os, shutil, sys, urllib.request, zipfile

            url, out_dir = sys.argv[1], sys.argv[2]

            class RemoteFile(io.RawIOBase):
                def __init__(self, url, size):
                    self.url, self.size, self.pos = url, size, 0
                def readable(self): return True
                def seekable(self): return True
                def seek(self, offset, whence=0):
                    if whence == 0: self.pos = offset
                    elif whence == 1: self.pos += offset
                    elif whence == 2: self.pos = self.size + offset
                    return self.pos
                def tell(self): return self.pos
                def read(self, n=-1):
                    if n == -1: n = self.size - self.pos
                    if n <= 0 or self.pos >= self.size: return b""
                    end = min(self.size - 1, self.pos + n - 1)
                    req = urllib.request.Request(self.url, headers={"Range": f"bytes={self.pos}-{end}"})
                    with urllib.request.urlopen(req) as r:
                        data = r.read()
                    self.pos += len(data)
                    return data

            with urllib.request.urlopen(urllib.request.Request(url, method="HEAD")) as r:
                size = int(r.headers["Content-Length"])
            with zipfile.ZipFile(RemoteFile(url, size)) as zf:
                dmgs = [i for i in zf.infolist() if i.filename.endswith((".dmg", ".dmg.aea"))]
                best = max(dmgs, key=lambda i: i.file_size)
                out_path = os.path.join(out_dir, os.path.basename(best.filename))
                with zf.open(best) as src, open(out_path, "wb") as dst:
                    shutil.copyfileobj(src, dst, length=8 * 1024 * 1024)
                print(out_path)
            ' "$IPSW_URL" out/ipsw/extracted)"
            echo "Extracted $ROOT_FILE"
            if [[ "$ROOT_FILE" == *.aea ]]; then
              ipsw fw aea "$ROOT_FILE" -o out/ipsw/extracted
              rm -f "$ROOT_FILE"
              ROOT_DMG="$(find out/ipsw/extracted -maxdepth 2 -name '*.dmg' | head -n 1)"
            else
              ROOT_DMG="$ROOT_FILE"
            fi
            test -f "$ROOT_DMG"
            MNT_SRC="$(mktemp -d)"
            MNT_DST="$(mktemp -d)"
            hdiutil attach "$ROOT_DMG" -mountpoint "$MNT_SRC" -nobrowse -readonly -owners on
            truncate -s 24g out/ipsw/ios26-userdata.hfs.img
            DEV_NODE="$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount out/ipsw/ios26-userdata.hfs.img | awk '{print $1; exit}')"
            sudo newfs_hfs -s -J -v B2LRoot "$DEV_NODE"
            hdiutil detach "$DEV_NODE" -force
            hdiutil attach -imagekey diskimage-class=CRawDiskImage out/ipsw/ios26-userdata.hfs.img -mountpoint "$MNT_DST" -nobrowse -owners on
            sudo rsync -aHAX --numeric-ids "$MNT_SRC/" "$MNT_DST/" || true
            sudo python3 scripts/prepare-ios-root.py "$MNT_DST" --verify || true
            hdiutil detach "$MNT_DST" -force || true
            hdiutil detach "$MNT_SRC" -force || true
            rm -rf out/ipsw/extracted
          fi
          test -f out/ipsw/ios26-userdata.hfs.img
          df -h

      - name: Clean temporary IPSW extraction files to free disk space
        run: rm -rf out/ipsw/extracted out/ipsw/*.ipsw

      - name: Save KDK and HFS userspace image cache
        if: always() && steps.cache-kdk-hfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/kdk
          key: b2l-kdk-25f71-v3

      - name: Fetch and prepare Mu-Silicium + beyond2lte platform overlay
        env:
          MU_SILICIUM_URL: ${{ secrets.MU_SILICIUM_URL || 'https://github.com/Project-Silicium/Mu-Silicium.git' }}
          BEYOND2LTE_UEFI_URL: ${{ secrets.BEYOND2LTE_UEFI_URL || 'https://github.com/orhunnx/UEFI_beyond2lte.git' }}
        run: |
          git clone "$MU_SILICIUM_URL" "$MU_WORK_TREE"
          git -C "$MU_WORK_TREE" checkout --detach "$MU_SILICIUM_COMMIT"
          git -C "$MU_WORK_TREE" submodule update --init --recursive
          actual_basecore="$(git -C "$MU_WORK_TREE/Mu_Basecore" rev-parse HEAD)"
          echo "Mu_Basecore at $actual_basecore (expected $MU_BASECORE_COMMIT)"

          ls -la "$MU_WORK_TREE/Platforms/Samsung/"

          make -C "$MU_WORK_TREE/Mu_Basecore/BaseTools/Source/C" -j"$BUILD_JOBS"

      - name: Fetch and prepare XNU source
        run: |
          scripts/fetch-xnu.sh "$GITHUB_WORKSPACE/xnu"
          scripts/prepare-xnu.sh "$GITHUB_WORKSPACE/xnu"

      - name: Build AvailabilityVersions and libfirehose_kernel dependencies
        run: |
          mkdir -p "$B2L_BUILD_ENV/src" "$B2L_DEPSROOT/usr/local/libexec" \
            "$B2L_DEPSROOT/usr/local/include/firehose" "$B2L_DEPSROOT/usr/local/include/os" \
            "$B2L_DEPSROOT/usr/local/include/kernel/firehose" "$B2L_DEPSROOT/usr/local/include/kernel/os" \
            "$B2L_DEPSROOT/usr/local/lib/kernel"

          git init -q "$B2L_BUILD_ENV/src/AvailabilityVersions"
          git -C "$B2L_BUILD_ENV/src/AvailabilityVersions" fetch -q --depth 1 https://github.com/apple-oss-distributions/AvailabilityVersions.git "$AVAILABILITY_COMMIT"
          git -C "$B2L_BUILD_ENV/src/AvailabilityVersions" checkout -q FETCH_HEAD
          make -C "$B2L_BUILD_ENV/src/AvailabilityVersions" install DSTROOT="$B2L_DEPSROOT"

          git init -q "$B2L_BUILD_ENV/src/libdispatch"
          git -C "$B2L_BUILD_ENV/src/libdispatch" fetch -q --depth 1 https://github.com/apple-oss-distributions/libdispatch.git "$LIBDISPATCH_COMMIT"
          git -C "$B2L_BUILD_ENV/src/libdispatch" checkout -q FETCH_HEAD

          make -C "$GITHUB_WORKSPACE/xnu" SDKROOT=macosx KDKROOT="$KDKROOT" \
            ARCH_CONFIGS=ARM64 TARGET_CONFIGS="DEVELOPMENT ARM64 B2L" \
            PLATFORM=iPhoneOS PLATFORM_FOR_CONFIG=iPhoneOS SDKVERSION=26.5 \
            OBJROOT="$GITHUB_WORKSPACE/out/xnu-hdrs/obj" \
            SYMROOT="$GITHUB_WORKSPACE/out/xnu-hdrs/sym" \
            DSTROOT="$B2L_DEPSROOT" installhdrs || true

          rsync -a "$B2L_BUILD_ENV/src/libdispatch/private/firehose/" "$B2L_DEPSROOT/usr/local/include/firehose/" 2>/dev/null || true
          rsync -a "$B2L_BUILD_ENV/src/libdispatch/os/" "$B2L_DEPSROOT/usr/local/include/os/" 2>/dev/null || true
          rsync -a "$B2L_DEPSROOT/usr/local/include/firehose/" "$B2L_DEPSROOT/usr/local/include/kernel/firehose/" 2>/dev/null || true
          rsync -a "$B2L_DEPSROOT/usr/local/include/os/" "$B2L_DEPSROOT/usr/local/include/kernel/os/" 2>/dev/null || true

          cat > "$B2L_BUILD_ENV/env.sh" <<EOF
          export KDKROOT="$KDKROOT"
          export B2L_DEPSROOT="$B2L_DEPSROOT"
          EOF
          scripts/build-firehose.sh

      - name: Run host loader tests (ASan/UBSan)
        run: scripts/test-loader.sh

      - name: Build XNU kernel (DEVELOPMENT ARM64 B2L)
        run: |
          scripts/build-kernel.sh CWARNFLAGS=-w CXXWARNFLAGS=-w

      - name: Build UEFI loader and beyond2lte firmware profile
        env:
          B2L_ENABLE_TOUCH: ${{ inputs.enable_touch && '1' || '0' }}
        run: |
          WORKSPACE="$MU_WORK_TREE" scripts/build-boot-firmware.sh

      - name: Package and verify boot.img
        run: |
          KERNEL_PATH="$(find out/xnu/obj -name 'mach.development.b2l' -type f | head -n 1)"
          FD_PATH="$(find "$MU_WORK_TREE/Build" -name '*.fd' -type f | head -n 1)"
          LOADER_PATH="$MU_WORK_TREE/Build/B2LXnu/RELEASE_CLANGPDB/AARCH64/XnuLoader.efi"
          test -f "$KERNEL_PATH"
          test -f "$FD_PATH"
          test -f "$LOADER_PATH"

          python3 scripts/package-boot.py \
            --mu "$MU_WORK_TREE" \
            --firmware "$FD_PATH" \
            --kernel "$KERNEL_PATH" \
            --loader "$LOADER_PATH" \
            --output-dir out/ci-boot \
            --max-image-bytes 67108864

          python3 scripts/package-boot.py --verify out/ci-boot/boot.img

      - name: Upload boot.img and disk images as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beyond2lte-xnu-artifacts
          path: |
            out/ci-boot/boot.img
            out/ci-boot/manifest.json
            out/ci-boot/beyond2lte-xnu-boot.tar
            out/ipsw/*.img
          if-no-files-found: error
